<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NXZES</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230C447C'/><text x='50%' y='50%' dominant-baseline='central' text-anchor='middle' font-family='monospace' font-size='12' font-weight='500' fill='%23E6F1FB' letter-spacing='0.5'>NX</text></svg>"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #042C53;
    --blue: #0C447C;
    --mid: #378ADD;
    --light: #E6F1FB;
  }

  html, body {
    height: 100%;
    background: var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .wordmark {
    font-family: 'DM Mono', monospace;
    font-weight: 300;
    font-size: clamp(48px, 12vw, 96px);
    letter-spacing: 0.25em;
    color: var(--light);
    opacity: 0;
    animation: reveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    position: relative;
    user-select: none;
  }

  .wordmark::after {
    content: '';
    display: block;
    height: 1px;
    background: var(--mid);
    width: 0%;
    margin-top: 12px;
    animation: line 1s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
  }

  @keyframes reveal {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes line {
    from { width: 0%; }
    to   { width: 100%; }
  }
</style>
</head>
<body>
  <div class="wordmark">NXZES</div>
</body>
</html>
